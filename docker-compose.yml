services:
  mcp:
    build: .
    ports:
      - "127.0.0.1:6967:6967"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./test_fixtures/game:/workspace/game:ro
      - ./test_fixtures/blog:/workspace/blog:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - PASTALESS_CONFIG=/app/config.toml
      - PASTALESS_ALLOWED_HOSTS=${PASTALESS_ALLOWED_HOSTS:-localhost,127.0.0.1,::1,ross-pride-pull-parameters.trycloudflare.com}
