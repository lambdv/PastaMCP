[package]
name = "pasta-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
rmcp = { version = "1.7", features = ["server", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
